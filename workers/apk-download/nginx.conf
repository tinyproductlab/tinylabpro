server {
    listen 8080;
    server_name _;
    server_tokens off;
    location = /dl/NConvo-1.0.0.apk {
        alias /srv/downloads/NConvo-1.0.0.apk;
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="NConvo-1.0.0.apk"' always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /dl/NConvo-macOS-arm64.zip {
        alias /srv/downloads/NConvo-macOS-arm64.zip;
        types { }
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="NConvo-macOS-arm64.zip"' always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /dl/NConvo-Windows-x64.zip {
        alias /srv/downloads/NConvo-Windows-x64.zip;
        types { }
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="NConvo-Windows-x64.zip"' always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # App Review asked for a screen recording; Apple opens this link from the review notes.
    location = /dl/NConvo-review-demo.mp4 {
        alias /srv/downloads/NConvo-review-demo.mp4;
        types { }
        default_type video/mp4;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / { return 404; }
}
