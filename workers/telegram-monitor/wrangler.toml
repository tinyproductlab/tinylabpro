name = "tinyproductlab-monitor"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "MONITOR_STATE"
id = "0d0187c876f44f1b9d166ad24c776719"

# 以下变量均通过 Cloudflare Dashboard 的 Variables and Secrets 设置为 Secret，
# 不写入此文件：TELEGRAM_BOT_TOKEN、TELEGRAM_CHAT_ID、WEBHOOK_SECRET。
